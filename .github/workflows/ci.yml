name: macOS checks and builds
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qesh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      preview: ${{ steps.plan.outputs.preview }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-plan.mjs
  build:
    needs: prepare
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Verify native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e 'if (process.arch !== process.env.EXPECTED_ARCH) throw new Error(`Unexpected architecture ${process.arch}`)'
      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node -e 'const fs=require("fs"),p=require("./package.json");p.version=process.env.RELEASE_VERSION;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile || { bun pm cache rm; bun install --frozen-lockfile; }
      - name: Install Electron native runtime
        run: node node_modules/electron/install.js
      - run: bun run check
      - run: bun test
      - run: node scripts/smoke-cli.mjs
      - run: node scripts/smoke-desktop.mjs
      - run: node scripts/smoke-restore.mjs
      - name: Build standalone app
        run: node scripts/build-macos-app.mjs dist/Qesh.app
      - name: Smoke-test bundled runtimes and shell sessions
        env:
          QENTRAH_NODE: ${{ github.workspace }}/dist/Qesh.app/Contents/Resources/runtime/node
          QENTRAH_BUN: ${{ github.workspace }}/dist/Qesh.app/Contents/Resources/runtime/bun
          QENTRAH_DESKTOP_HOST: ${{ github.workspace }}/dist/Qesh.app/Contents/Resources/terminal/desktop/host.mjs
        run: |
          node scripts/smoke-desktop.mjs
          node scripts/smoke-restore.mjs
      - name: Verify signature after runtime test
        run: codesign --verify --deep --strict dist/Qesh.app
      - name: Package app, sidecar configuration, and checksum
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        working-directory: dist
        run: |
          ditto -c -k --sequesterRsrc --keepParent Qesh.app "Qesh-macOS-${BUILD_ARCH}.zip"
          zip -j "Qesh-macOS-${BUILD_ARCH}.zip" qesh.config.json
          shasum -a 256 "Qesh-macOS-${BUILD_ARCH}.zip" > "Qesh-macOS-${BUILD_ARCH}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Qesh-macOS-${{ matrix.arch }}
          path: |
            dist/Qesh-macOS-*.zip
            dist/Qesh-macOS-*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  cli-package:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Apply release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node -e 'const fs=require("fs"),p=require("./package.json");p.version=process.env.RELEASE_VERSION;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
      - name: Build and test standalone CLI package
        run: node scripts/smoke-qh-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Qentrah-CLI
          path: |
            dist/qentrah-qh.tgz
            dist/qentrah-qh.sha256
          if-no-files-found: error
  release:
    name: Publish tested macOS release
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build, cli-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Qesh-macOS-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: Qentrah-CLI
          path: release
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_PREVIEW: ${{ needs.prepare.outputs.preview }}
        run: |
          for arch in arm64 x64; do
            test -s "release/Qesh-macOS-$arch.zip"
            test -s "release/Qesh-macOS-$arch.sha256"
            (cd release && sha256sum -c "Qesh-macOS-$arch.sha256")
          done
          (cd release && sha256sum -c qentrah-qh.sha256)
          cp scripts/install.sh release/install.sh
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release/draft-state; then
            if [ "$(cat release/draft-state)" = false ]; then
              echo "Release already published; preserving its assets."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "Qesh $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/*.zip release/*.sha256 release/*.tgz release/install.sh --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$RELEASE_PREVIEW"
