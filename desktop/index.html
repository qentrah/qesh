<!doctype html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'">
<title>Qesh</title><link rel="stylesheet" href="xterm.css"><link rel="stylesheet" href="style.css"></head>
<body>
<header><span class="brand">Qesh</span><button id="more" aria-label="Workspace options" aria-haspopup="menu" aria-expanded="false">•••</button></header>
<div id="menu" role="menu" hidden>
<button role="menuitem" data-action="new-tab">New Tab <kbd>⌘T</kbd></button><button role="menuitem" data-action="new-workspace">New Workspace…</button><button role="menuitem" data-action="new-window">New Window <kbd>⌘N</kbd></button><button role="menuitem" data-action="configure">Configure… <kbd>⌘,</kbd></button>
<hr><button role="menuitem" data-action="split-right">Split Right</button><button role="menuitem" data-action="split-down">Split Down</button><button role="menuitem" data-action="group">New Group…</button><button role="menuitem" data-action="folder">Open / Create Folder…</button>
<hr><button role="menuitem" data-action="commands">Commands… <kbd>⌘⇧P</kbd></button><button role="menuitem" data-action="help">Keyboard Shortcuts</button><button role="menuitem" data-action="check-updates">Check for Updates</button><button role="menuitem" data-action="about">About Qentrah</button></div>
<div id="workspace"><aside aria-label="Tabs and groups"><div class="sidebar-title"><span>Workspaces</span></div><div id="spaces"></div><div id="tabs"></div><button id="add-tab" aria-label="Add tab to current workspace" class="sidebar-add">+</button></aside><div id="sidebar-divider" role="separator" tabindex="0" aria-label="Resize tab sidebar" aria-orientation="vertical" aria-valuemin="140" aria-valuemax="360" aria-valuenow="200"></div>
<main id="stage" aria-label="Qentrah terminal workspace"><div id="terminal"></div><div id="drop-zones" hidden><div data-edge="left">Dock left</div><div data-edge="right">Dock right</div><div data-edge="top">Dock above</div><div data-edge="bottom">Dock below</div></div></main></div>
<div id="context-menu" role="menu" aria-label="Item actions" hidden></div>
<p id="status" role="status" hidden></p>
<dialog id="editor"><form id="editor-form"><h1 id="editor-title">Configure</h1><p id="editor-description"></p><label id="editor-label" for="editor-input">Configuration JSON</label><textarea id="editor-input" spellcheck="false"></textarea><p id="editor-error" role="alert"></p><div class="dialog-actions"><button type="button" id="open-config">Open in Editor</button><span></span><button type="button" id="cancel-editor">Cancel</button><button type="submit" id="save-editor">Save</button></div></form></dialog>
<dialog id="command-dialog"><form id="command-form"><h1>Commands</h1><label for="command-input">Type a command</label><input id="command-input" autocomplete="off" placeholder="/help, /config, /new-tab…"><div id="command-list"></div><p id="command-error" role="alert"></p><button type="button" id="close-commands">Close</button></form></dialog>
<script src="renderer.bundle.js"></script></body></html>
